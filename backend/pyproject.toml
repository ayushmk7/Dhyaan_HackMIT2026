[project]
name = "dhyaan-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "motor>=3.6",
    "pydantic>=2.9",
    "httpx>=0.27",
    "numpy>=2.0",
    "python-ulid>=3.0",
    "anthropic>=0.40",
]

[tool.setuptools]
# Flat layout: without this, setuptools autodiscovery sees fixtures/ as a
# second top-level package and refuses to build.
packages = ["app", "app.routers", "scripts"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
