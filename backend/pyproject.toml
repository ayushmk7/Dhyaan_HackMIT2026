[project]
name = "dhyaan-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "motor>=3.6",
    "pydantic>=2.9",
    "httpx>=0.27",
    "numpy>=2.0",
    "python-ulid>=3.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# ponytail: the camera lane's deps live behind an extra so `uv pip install -e .`
# stays a 10 s install for anyone who is not touching vision. ultralytics drags
# torch (~1 GB of wheels). Ceiling: torch is CPU/MPS only here; upgrade is nothing
# — a Mac is the target. Install with: uv pip install -e ".[vision]"
vision = [
    "opencv-python>=4.10",
    "ultralytics>=8.3",
]

[tool.setuptools]
# Flat layout: without this, setuptools autodiscovery sees fixtures/ as a
# second top-level package and refuses to build.
packages = ["app", "app.routers", "scripts", "vision"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
