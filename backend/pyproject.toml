[project]
name = "dhyaan-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "motor>=3.6",
    "pydantic>=2.9",
    "httpx>=0.27",
    "numpy>=2.0",
    "python-ulid>=3.0",
    "anthropic>=0.40",
    "twilio>=9.0",
    "websockets>=13.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# ponytail: the camera lane's deps live behind an extra so `uv pip install -e .`
# stays a 10 s install for anyone who is not touching vision. ultralytics drags
# torch (~1 GB of wheels). Ceiling: torch is CPU/MPS only here; upgrade is nothing
# — a Mac is the target. Install with: uv pip install -e ".[vision]"
vision = [
    "opencv-python>=4.10",
    "ultralytics>=8.3",
    # YOLO-World's `set_classes()` builds CLIP text embeddings and needs
    # ultralytics' CLIP fork, which ultralytics does not depend on and tries to
    # pip-install at runtime (which fails in a uv venv with no pip). Pinned to
    # the commit this machine runs. The weights themselves (yolov8s-worldv2.pt,
    # ~25 MB, and CLIP ViT-B/32, ~340 MB) download by name on first start and
    # are gitignored.
    "clip @ git+https://github.com/ultralytics/CLIP.git@a13192f8cb767260d7dfd98c843b0716593169e7",
    # Pose landmarks for posture. Pinned, not floated: 1.0.1 hard-aborts the
    # whole process inside a Metal helper on this machine's arm64 Python (it
    # takes the camera lane down with it, no traceback), and 0.10.35 is the
    # last release that runs clean here. Only the PoseLandmarker is used —
    # YOLO above still does the boxes.
    "mediapipe==0.10.35",
]

[tool.setuptools]
# Flat layout: without this, setuptools autodiscovery sees fixtures/ as a
# second top-level package and refuses to build.
packages = ["app", "app.routers", "scripts", "vision"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
